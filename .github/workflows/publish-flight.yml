name: Publish flight lookup to dashboard
on:
  workflow_dispatch:
    inputs:
      flight_number:
        description: Southwest flight number
        required: true
        default: '2728'
      flight_date:
        description: Flight date YYYY-MM-DD
        required: true
        default: '2026-10-15'
permissions:
  contents: write
concurrency:
  group: flight-cache-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate flight
        env:
          RAPIDAPI_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          NUMBER: ${{ inputs.flight_number }}
          DATE: ${{ inputs.flight_date }}
        run: |
          python3 - <<'PY'
          import os,json,re,urllib.request,datetime,pathlib
          number=os.environ['NUMBER'].strip()
          date=os.environ['DATE'].strip()
          assert re.fullmatch(r'[0-9]{1,5}',number)
          datetime.date.fromisoformat(date)
          assert os.environ.get('RAPIDAPI_KEY'), 'Missing AERODATABOX_API_KEY secret'
          url=f'https://aerodatabox.p.rapidapi.com/flights/number/WN{number}/{date}'
          req=urllib.request.Request(url,headers={'X-RapidAPI-Key':os.environ['RAPIDAPI_KEY'],'X-RapidAPI-Host':'aerodatabox.p.rapidapi.com'})
          with urllib.request.urlopen(req,timeout=30) as r: flights=json.load(r)
          if not isinstance(flights,list): raise ValueError('Unexpected API response')
          result=[]
          for f in flights:
              if re.sub(r'\s+','',str(f.get('number',''))).upper()!=f'WN{int(number)}':continue
              dep=f.get('departure') or {}; arr=f.get('arrival') or {}
              if not dep.get('airport',{}).get('iata') or not arr.get('airport',{}).get('iata'):continue
              result.append({'number':f'WN{int(number)}','date':date,'status':f.get('status','Unknown'),'departure':{'iata':dep['airport']['iata'],'scheduled':(dep.get('scheduledTime') or {}),'terminal':dep.get('terminal'),'gate':dep.get('gate')},'arrival':{'iata':arr['airport']['iata'],'scheduled':(arr.get('scheduledTime') or {}),'predicted':(arr.get('predictedTime') or {}),'terminal':arr.get('terminal'),'gate':arr.get('gate')}})
          target=pathlib.Path('data')/date/f'WN{int(number)}.json'
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps({'source':'AeroDataBox','retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'flights':result},indent=2))
          print('Saved',target,'matching flights:',len(result))
          PY
      - name: Commit public non-secret flight data
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/
          git diff --cached --quiet || (git commit -m "Update flight lookup cache" && git push)
