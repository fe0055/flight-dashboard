name: Test AeroDataBox API
on:
  workflow_dispatch:
    inputs:
      flight_number:
        description: Southwest flight number (digits only)
        required: true
        default: '2728'
      flight_date:
        description: Departure date YYYY-MM-DD
        required: true
        default: '2026-10-15'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query documented flight-status API
        env:
          RAPIDAPI_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          FLIGHT_NUMBER: ${{ inputs.flight_number }}
          FLIGHT_DATE: ${{ inputs.flight_date }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,re
          key=os.environ.get('RAPIDAPI_KEY','')
          if not key:
              print('SETUP NEEDED: Add repository secret AERODATABOX_API_KEY. No request sent.')
              raise SystemExit(0)
          number=os.environ['FLIGHT_NUMBER'].strip()
          date=os.environ['FLIGHT_DATE'].strip()
          if not re.fullmatch(r'\d{1,5}',number) or not re.fullmatch(r'\d{4}-\d{2}-\d{2}',date):
              raise SystemExit('Invalid flight number or date')
          url=f'https://aerodatabox.p.rapidapi.com/flights/number/WN{number}/{date}'
          req=urllib.request.Request(url,headers={'X-RapidAPI-Key':key,'X-RapidAPI-Host':'aerodatabox.p.rapidapi.com','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  data=json.load(response)
                  print('HTTP:',response.status)
                  if isinstance(data,list):
                      print('Flights returned:',len(data))
                      for flight in data[:5]:
                          print('Flight:',json.dumps({k:flight.get(k) for k in ('number','status','departure','arrival','airline')},ensure_ascii=False)[:2500])
                  else:
                      print('Response keys:',list(data)[:15] if isinstance(data,dict) else type(data).__name__)
          except urllib.error.HTTPError as e:
              print('HTTP:',e.code,'Response:',e.read(500).decode('utf-8','replace'))
          except Exception as e:
              print('Error:',type(e).__name__,str(e)[:300])
          PY