name: Test FlightStats public page
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flightstats-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public FlightStats page access
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          url='https://www.flightstats.com/v2/flight-tracker/WN/2728?year=2026&month=10&date=15'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  body=r.read(250000).decode('utf-8','replace')
                  print('HTTP:',r.status)
                  print('Final URL:',r.url.split('?')[0])
                  print('Content-Type:',r.headers.get('Content-Type'))
                  print('HTML bytes:',len(body))
                  print('Flight number present:', '2728' in body)
                  print('Airport codes present:', 'MCO' in body, 'BWI' in body)
                  print('Page title excerpt:',body[body.find('<title'):body.find('</title>')+8][:200])
                  print('NOTE: Markers in HTML do not establish that flight data is accessible or licensed for app reuse.')
          except urllib.error.HTTPError as e:
              print('HTTP error:',e.code)
          except Exception as e:
              print('Request error:',type(e).__name__,str(e)[:250])
          PY