name: Inspect FlightStats structured data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public page structured metadata
        run: |
          python3 - <<'PY'
          import urllib.request,re,json,html
          from html.parser import HTMLParser
          url='https://www.flightstats.com/v2/flight-tracker/WN/2728?year=2026&month=10&date=15'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
          with urllib.request.urlopen(req,timeout=30) as response:
              page=response.read().decode('utf-8','replace')
              print('HTTP:',response.status,'Bytes:',len(page))
          for term in ['__NEXT_DATA__','application/ld+json','departureAirport','arrivalAirport','departureGate','arrivalGate','scheduledDeparture','scheduledArrival','MCO','BWI']:
              matches=list(re.finditer(re.escape(term),page,re.I))
              print('\nFIELD:',term,'COUNT:',len(matches))
              for m in matches[:2]:
                  print('CONTEXT:',html.unescape(re.sub(r'<[^>]*>',' ',page[max(0,m.start()-110):m.end()+160]))[:300])
          scripts=re.findall(r'<script[^>]*type=["\']application/ld\\+json["\'][^>]*>(.*?)</script>',page,re.I|re.S)
          print('\nJSON-LD blocks:',len(scripts))
          for raw in scripts[:3]:
              try: print('JSON-LD:',json.dumps(json.loads(raw))[:800])
              except: print('JSON-LD parse failed')
          print('\nThis test does not establish permission for automated data reuse.')
          PY