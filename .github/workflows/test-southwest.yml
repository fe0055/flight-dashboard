name: Test Southwest flight lookup
on:
  push:
    paths:
      - '.github/workflows/test-southwest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check official Southwest flight-status response
        env:
          FLIGHT: '1933'
        run: |
          python3 - <<'PY'
          import datetime, urllib.request, urllib.error, json
          date=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=-4))).date().isoformat()
          urls=[
            f'https://www.southwest.com/air/flight-status/path.html?departureDate={date}&flightNumber=1933',
            f'https://www.southwest.com/api/air-operations/v1/air-operations/api/air/flights/path?departureDate={date}&flightNumber=1933'
          ]
          for url in urls:
              print('Testing:',url.split('?')[0], 'date',date)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; personal-flight-dashboard-test/1.0)','Accept':'application/json,text/html'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      data=r.read(300000)
                      print('HTTP',r.status,'content-type',r.headers.get('Content-Type'),'bytes',len(data))
                      try:
                          j=json.loads(data)
                          print('JSON top-level keys:',list(j)[:20] if isinstance(j,dict) else 'array')
                      except Exception:
                          print('HTML response:',b'<html' in data.lower() or b'<!doctype' in data.lower())
              except urllib.error.HTTPError as e:
                  print('HTTP',e.code,'content-type',e.headers.get('Content-Type'))
              except Exception as e:
                  print('Request error:',type(e).__name__,str(e)[:200])
          PY